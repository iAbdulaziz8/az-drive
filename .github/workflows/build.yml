
name: Build AZ Drive APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AZ_Drive_Project_v0.2.0.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          set +e
          unzip -o AZ_Drive_Project_v0.2.0.zip
          unzip_status=$?
          if [ "$unzip_status" -gt 1 ]; then
            exit "$unzip_status"
          fi
          test -f az_drive/app/src/main/AndroidManifest.xml
          test -f az_drive/app/src/main/assets/index.html

      - name: Build APK
        working-directory: az_drive
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZ-Drive-APK
          path: az_drive/app/build/outputs/apk/debug/app-debug.apk
